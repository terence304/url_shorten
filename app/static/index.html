<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
    }
    input[type="url"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus {
      border-color: #3b82f6;
    }
    input[type="url"]::placeholder {
      color: #475569;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled {
      background: #334155;
      cursor: not-allowed;
    }
    .result {
      margin-top: 1.5rem;
      display: none;
    }
    .result.show { display: block; }
    .result-label {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }
    .result-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .result-box a {
      flex: 1;
      color: #60a5fa;
      text-decoration: none;
      font-size: 1rem;
      word-break: break-all;
    }
    .result-box a:hover { text-decoration: underline; }
    .btn-copy {
      background: #334155;
      color: #e2e8f0;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    .btn-copy:hover { background: #475569; }
    .btn-copy.copied {
      background: #22c55e;
      color: #fff;
    }
    .error {
      margin-top: 1rem;
      color: #f87171;
      font-size: 0.9rem;
      display: none;
    }
    .error.show { display: block; }
    .history {
      margin-top: 2rem;
    }
    .history h3 {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid #334155;
      font-size: 0.85rem;
    }
    .history-item:last-child { border-bottom: none; }
    .history-long {
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 300px;
    }
    .history-short a {
      color: #60a5fa;
      text-decoration: none;
    }
    .history-short a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>URL Shortener</h1>
    <p class="subtitle">Paste a long URL and get a short one instantly</p>

    <div class="card">
      <label for="long-url">Enter your long URL</label>
      <div class="input-row">
        <input type="url" id="long-url" placeholder="https://example.com/very/long/path" autofocus />
        <button class="btn-primary" id="shorten-btn" onclick="shortenUrl()">Shorten</button>
      </div>

      <div class="error" id="error-msg"></div>

      <div class="result" id="result">
        <p class="result-label">Your shortened URL</p>
        <div class="result-box">
          <a id="short-link" href="#" target="_blank"></a>
          <button class="btn-copy" id="copy-btn" onclick="copyUrl()">Copy</button>
        </div>
      </div>

      <div class="history" id="history" style="display:none;">
        <h3>Recent</h3>
        <div id="history-list"></div>
      </div>
    </div>
  </div>

  <script>
    const API = '/api/v1/shorten';
    const history = [];

    const input    = document.getElementById('long-url');
    const btn      = document.getElementById('shorten-btn');
    const result   = document.getElementById('result');
    const shortLink= document.getElementById('short-link');
    const copyBtn  = document.getElementById('copy-btn');
    const errorMsg = document.getElementById('error-msg');
    const historyEl= document.getElementById('history');
    const histList = document.getElementById('history-list');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') shortenUrl(); });

    async function shortenUrl() {
      const longUrl = input.value.trim();
      if (!longUrl) return;

      btn.disabled = true;
      btn.textContent = '...';
      errorMsg.className = 'error';
      result.className = 'result';

      try {
        const resp = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ long_url: longUrl }),
        });

        if (!resp.ok) {
          const err = await resp.json();
          throw new Error(err.detail || 'Failed to shorten URL');
        }

        const data = await resp.json();
        const shortUrl = data.short_url;

        shortLink.href = shortUrl;
        shortLink.textContent = shortUrl;
        result.className = 'result show';
        copyBtn.textContent = 'Copy';
        copyBtn.className = 'btn-copy';

        history.unshift({ long: longUrl, short: shortUrl });
        if (history.length > 5) history.pop();
        renderHistory();

        input.value = '';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.className = 'error show';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    }

    async function copyUrl() {
      try {
        await navigator.clipboard.writeText(shortLink.href);
        copyBtn.textContent = 'Copied!';
        copyBtn.className = 'btn-copy copied';
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.className = 'btn-copy';
        }, 2000);
      } catch {
        /* fallback for non-HTTPS */
        const ta = document.createElement('textarea');
        ta.value = shortLink.href;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copyBtn.textContent = 'Copied!';
        copyBtn.className = 'btn-copy copied';
      }
    }

    function renderHistory() {
      if (history.length === 0) { historyEl.style.display = 'none'; return; }
      historyEl.style.display = 'block';
      histList.innerHTML = history.map(h => `
        <div class="history-item">
          <span class="history-long" title="${h.long}">${h.long}</span>
          <span class="history-short"><a href="${h.short}" target="_blank">${h.short}</a></span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
