[project]
name = "url-shorten"
version = "0.1.0"
description = "A high-performance URL shortener service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.31",
    "redis>=5.0,<5.3",
    "pydantic-settings>=2.3,<2.8",
    "alembic>=1.13,<1.16",
    "passlib[bcrypt]>=1.7,<1.8",
    "python-jose[cryptography]>=3.3,<3.4",
    "python-multipart>=0.0.9,<0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<8.4",
    "pytest-asyncio>=0.23,<0.25",
    "httpx>=0.27,<0.29",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
